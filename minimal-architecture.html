<style>
:root{--paper:#faf8f3;--ink:#282821;--orange:#e87535;--muted:#77746c;--line:#dedbd3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kurenaido","Yu Gothic","Meiryo",sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1120px,92vw);margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{height:42px;width:auto;object-fit:contain}
.nav{display:flex;gap:24px;font-size:.82rem;letter-spacing:.16em}
.nav a:hover,.back:hover{color:var(--orange)}
.page-head{padding:56px 0 0}
.eyebrow{font-size:.72rem;letter-spacing:.28em;color:var(--muted);margin:0 0 14px;text-transform:uppercase}
h1{font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.35;margin:0 0 8px;font-weight:normal}
.sec-sub{margin:0 0 28px;color:var(--muted);font-size:.94rem}
.work-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px}
.work-item{margin:0;min-width:0}
.work-image{display:flex;align-items:center;justify-content:center;background:transparent;cursor:zoom-in}
.work-image img{width:100%;height:auto;object-fit:contain}
figcaption{padding-top:8px;color:var(--muted);font-size:.88rem;letter-spacing:.08em}
.back{display:inline-block;margin-top:36px;font-size:.85rem;letter-spacing:.1em;border-bottom:1px solid var(--line);padding-bottom:2px}
.footer{margin-top:70px;border-top:1px solid var(--line);padding:26px 0 34px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.footer a{border-bottom:1px solid var(--line)}
@media(max-width:900px){.work-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}}
@media(max-width:640px){.header{gap:14px}.nav{gap:16px;font-size:.74rem;letter-spacing:.1em}.page-head{padding-top:34px}.work-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.footer{margin-top:48px}}
</style>
